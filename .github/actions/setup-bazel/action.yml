name: Set up Bazel build dependencies
description: Install the native and cross compilers used by gVisor's Bazel targets.
runs:
  using: composite
  steps:
    - name: Install build and test dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential crossbuild-essential-arm64 crossbuild-essential-amd64 \
          clang libbpf-dev libc6-dev-i386 libnuma-dev \
          erofs-utils busybox-static iptables iproute2 zip unzip python3
    - name: Install Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/bazelisk" \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
        echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazelisk" | sha256sum -c -
        sudo install -m 0755 "$RUNNER_TEMP/bazelisk" /usr/local/bin/bazel
        bazel --version
