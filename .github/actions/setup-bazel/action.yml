name: Set up Bazel build dependencies
description: Install the native and cross compilers used by gVisor's Bazel targets.
runs:
  using: composite
  steps:
    - name: Install build and test dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential crossbuild-essential-arm64 crossbuild-essential-amd64 \
          clang libbpf-dev libc6-dev-i386 libnuma-dev \
          erofs-utils busybox-static iptables iproute2 zip unzip python3
    - name: Install Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        sudo curl -fsSL -o /usr/local/bin/bazel \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.26.2/bazelisk-linux-amd64
        sudo chmod +x /usr/local/bin/bazel
        bazel --version
