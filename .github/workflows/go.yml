# This workflow generates the Go branch. Note that this does not test the Go
# branch, as this is rolled into the main continuous integration pipeline. This
# workflow simply generates and pushes the branch, as long as appropriate
# permissions are available.
name: "Go"
"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
    - id: setup
      run: |
        if ! [[ -z "${{ secrets.GO_TOKEN }}" ]]; then
          echo has_token=true >> "$GITHUB_OUTPUT"
        else
          echo has_token=false >> "$GITHUB_OUTPUT"
        fi
    - run: |
        jq -nc '{"state": "pending", "context": "go tests"}' | \
        curl -sL -X POST -d @- \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.pull_request.statuses_url }}"
      if: github.event_name == 'pull_request'
    - uses: actions/checkout@v5
      if: github.event_name == 'push' && steps.setup.outputs.has_token == 'true'
      with:
        fetch-depth: 0
        token: '${{ secrets.GO_TOKEN }}'
    - uses: actions/checkout@v5
      if: github.event_name == 'pull_request' || steps.setup.outputs.has_token != 'true'
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v6.0.0
      with:
        go-version-file: 'go.mod'
    - run: tools/go_branch.sh
    - run: git checkout go && git clean -xf . && go build ./...
    - if: github.event_name == 'push'
      run: |
        git remote add upstream "https://github.com/${{ github.repository }}"
        git push upstream go:go
    - if: ${{ success() && github.event_name == 'pull_request' }}
      run: |
        jq -nc '{"state": "success", "context": "go tests"}' | \
        curl -sL  -X POST -d @- \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.pull_request.statuses_url }}"
    - if: ${{ failure() && github.event_name == 'pull_request' }}
      run: |
        jq -nc '{"state": "failure", "context": "go tests"}' | \
        curl -sL  -X POST -d @- \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.pull_request.statuses_url }}"

  # Proves the plain-Go external-consumer surface (pkg/lisafs, pkg/flipcall,
  # pkg/fdchannel via the gopath archive / synthetic go branch) builds and
  # vets out-of-tree, fully offline (GOPROXY=off).
  plain-go-consumer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6.0.0
      with:
        go-version-file: 'go.mod'
    - uses: ./.github/actions/setup-bazel
    - name: warm module cache
      run: go mod download golang.org/x/sys golang.org/x/exp golang.org/x/time
    - name: plain-Go consumer build+vet
      run: |
        bazel test \
          --test_env=HOME \
          --test_env=PATH \
          --test_output=streamed \
          //pkg/lisafs:plain_go_import_test
    - name: Darwin platform seam build
      run: |
        bazel build \
          --platforms=@io_bazel_rules_go//go/toolchain:darwin_arm64 \
          //pkg/fd //pkg/fdchannel //pkg/eventfd //pkg/seccomp \
          //pkg/flipcall //pkg/memutil //pkg/sentry/hostmm \
          //pkg/sentry/platform //pkg/sentry/platform/interrupt \
          //pkg/sentry/platform/platforms
